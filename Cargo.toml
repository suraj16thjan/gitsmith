[package]
name = "gitsmith"
version = "1.0.2"
edition = "2024"
description = "A fast terminal UI for GitLab and GitHub, wrapping the glab and gh CLIs (Rust + ratatui)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/suraj16thjan/gitsmith"
homepage = "https://github.com/suraj16thjan/gitsmith"
keywords = ["gitlab", "github", "tui", "ratatui", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# pure-Rust regex backend (default-fancy) so `cargo install` needs no C toolchain (onig)
syntect = { version = "5.3.0", default-features = false, features = [
  "default-fancy",
] }
